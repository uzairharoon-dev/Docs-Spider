# DocuRAG configuration. CLI flags override these values.
# data_dir: ~/.docurag        # where the SQLite DB lives (or set DOCURAG_HOME)
concurrency: 16              # concurrent fetches across all domains

libraries:
  - name: fastapi
    start_urls: [https://fastapi.tiangolo.com/]
    include: ["/tutorial/", "/advanced/"]
    exclude: ["/zh/", "/ja/", "/ko/", "/pt/", "/ru/", "/es/", "/de/", "/tr/", "/uk/", "/fr/"]
    render_js: false
    rate_limit: 2            # requests per second per domain

embedder:
  provider: local              # local (fastembed, CPU) | openai (any compatible API) | hash
  model: BAAI/bge-small-en-v1.5
  # provider: openai
  # model: text-embedding-3-small
  # base_url: https://api.openai.com/v1
  # api_key_env: OPENAI_API_KEY

store:
  type: sqlite                 # no server needed
  # type: qdrant
  # url: http://localhost:6333 # or omit url to run Qdrant embedded under data_dir

chunking: {min_tokens: 300, max_tokens: 512, overlap: 0.12}
