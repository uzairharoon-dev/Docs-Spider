[project]
name = "docurag"
version = "0.1.0"
description = "Crawl any docs site, index it by version, and serve it to AI coding assistants over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastembed>=0.4",
    "numpy>=1.26",
    "mcp>=1.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]
qdrant = [
    "qdrant-client>=1.10",
]

[project.scripts]
docurag = "docurag.serve.cli:app"

[dependency-groups]
bench = [
    "psutil>=7.2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "qdrant-client>=1.10",
    "ruff>=0.5",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docurag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM905 wants "a b c".split() as a list literal; the string form reads better for word lists.
ignore = ["SIM905"]
